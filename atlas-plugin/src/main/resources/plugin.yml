name: ArkAtlas
version: 1.0.1
main: de.ark.atlas.ArkAtlas
api-version: '26.3'
author: ARK
description: Native world atlas and adventure leaderboard for ARK.
softdepend: [Multiverse-Core, Multiverse-Inventories]
commands:
  rangliste:
    aliases: [leaderboard]
    description: Abenteuer-Rangliste anzeigen / Show the adventure leaderboard
    usage: /rangliste
    permission: arkatlas.leaderboard
  atlas:
    description: ARK-Weltatlas in Survival erhalten
    usage: /atlas
    permission: arkatlas.use
  arkatlas:
    description: Atlas aus lokalen Dateien neu laden
    usage: /arkatlas reload
    permission: arkatlas.admin
permissions:
  arkatlas.leaderboard:
    default: true
  arkatlas.use:
    default: true
  arkatlas.admin:
    default: op
