survival-worlds:
  - ark
  - jurassic_archipelago

# Models and dinosaur eggs are also available in the existing Creative world.
# Taming, care and riding still require Survival in a survival-world.
prototype-worlds:
  - ark
  - jurassic_archipelago
  - ark_creative

# Encounters across loaded Overworld terrain in prototype-worlds. Existing pets,
# placed eggs and named/site dinosaurs are never replaced. Taming makes a natural
# dinosaur persistent; other natural encounters are not saved to disk.
wild-spawning:
  enabled: true
  per-player: 8
  world-limit: 64
  nearby-limit: 6
