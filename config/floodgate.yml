# Keys and linking records are generated privately on this installation.
key-file-name: key.pem
username-prefix: "."
replace-spaces: true
disconnect:
  invalid-key: Please connect through the official Geyser
  invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?
player-link:
  enabled: true
  require-link: false
  enable-own-linking: true
  allowed: true
  link-code-timeout: 300
  type: sqlite
  enable-global-linking: true
metrics:
  enabled: true
  uuid: ${metrics.uuid}
config-version: 3
